<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>23 - Metronome</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-metronome-component"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Metronome - 120 BPM"
      position="-1.5 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-sphere
      id="beatSphere"
      position="0 1 -4"
      radius="0.6"
      color="#4CC9F0">
    </a-sphere>

    <a-text
      id="beatText"
      value="Beat: 0"
      position="-0.5 0 -4"
      color="#FFD166"
      width="4">
    </a-text>

    <a-entity id="clock" metronome="bpm: 120"></a-entity>

    <a-sky color="#172033"></a-sky>
  </a-scene>

  <script>
    const clock = document.querySelector("#clock");
    const sphere = document.querySelector("#beatSphere");
    const beatText = document.querySelector("#beatText");

    let beat = 0;

    clock.addEventListener("beat", function () {
      beat++;

      beatText.setAttribute("value", "Beat: " + beat);

      sphere.setAttribute("color",
        beat % 2 === 0 ? "#F72585" : "#4CC9F0"
      );

      sphere.setAttribute("animation", {
        property: "scale",
        to: "1.4 1.4 1.4",
        dur: 150,
        dir: "alternate",
        loop: 1
      });
    });
  </script>
</body>
</html>
