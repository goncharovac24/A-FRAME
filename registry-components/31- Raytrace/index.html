<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>31 - Raytrace</title>

  <script src="https://aframe.io/releases/0.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-raytrace-component/dist/aframe-raytrace-component.min.js"></script>
</head>

<body>
  <script id="rayShader" type="x-shader/x-fragment">
    uniform float time;
    uniform vec3 localCameraPos;
    varying vec3 localSurfacePos;

    void main() {
      vec3 direction = normalize(localSurfacePos - localCameraPos);
      float glow = 0.5 + 0.5 * sin(time + direction.x * 5.0);
      gl_FragColor = vec4(1.0, glow * 0.2, 1.0, 1.0);
    }
  </script>

  <a-scene background="color: #101020">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Raytrace Component"
      position="-1.5 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-box
      position="0 1 -4"
      width="2"
      height="2"
      depth="0.5"
      raytrace="shader: #rayShader">
    </a-box>

    <a-sky color="#101020"></a-sky>
  </a-scene>
</body>
</html>
