<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>05 - Controller Cursor</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-controller-cursor-component@0.2.7/dist/aframe-controller-cursor-component.min.js"></script>
</head>

<body>
<a-scene background="color: #111827">

  <a-sky color="#111827"></a-sky>

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-plane rotation="-90 0 0" width="20" height="20"
    color="#202C45"></a-plane>

  <a-text value="CONTROLLER CURSOR"
    position="-2 3 -4" color="#00E5FF" width="5"></a-text>

  <!-- Objetos selecionáveis -->
  <a-box position="-2 1 -4" color="#FF4F81"
    class="target"
    animation__enter="property: scale; to: 1.3 1.3 1.3; dur: 200; startEvents: mouseenter"
    animation__leave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave">
  </a-box>

  <a-sphere position="0 1 -4" color="#00E5FF"
    class="target">
  </a-sphere>

  <a-torus position="2 1 -4" color="#B66BFF"
    radius="0.7" radius-tubular="0.15"
    class="target">
  </a-torus>

  <!-- Controlador VR -->
  <a-entity vive-controls="hand: right"
    controller-cursor
    raycaster="objects: .target">
  </a-entity>

  <!-- Câmara para testar sem VR -->
  <a-camera position="0 2 5">
    <a-cursor
      fuse="true"
      fuse-timeout="1200"
      raycaster="objects: .target"
      material="color: white; shader: flat"
      geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025">
    </a-cursor>
  </a-camera>

</a-scene>
</body>
</html>
