<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>24 - Motion Capture</title>

  <script src="https://aframe.io/releases/0.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-motion-capture-components/dist/aframe-motion-capture-components.min.js"></script>
</head>

<body>
  <a-scene avatar-recorder>

    <a-entity
      id="camera"
      camera
      look-controls
      position="0 1.6 0">
    </a-entity>

    <a-entity
      id="controller1"
      hand-controls="left">
    </a-entity>

    <a-entity
      id="controller2"
      hand-controls="right">
    </a-entity>

    <a-box
      position="0 1 -3"
      color="#4CC9F0"
      rotation="0 45 0">
    </a-box>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#35465c">
    </a-plane>

    <a-sky color="#172033"></a-sky>

  </a-scene>
</body>
</html>
