<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>27 - Particle System</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@1.2.x/dist/aframe-particle-system-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #080820">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Particle System"
      position="-1.5 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-entity
      position="0 1 -4"
      particle-system="
        preset: dust;
        particleCount: 1500;
        color: #00FFFF, #FF00FF;
        size: 0.15">
    </a-entity>

    <a-sphere
      position="0 1 -4"
      radius="0.4"
      color="#FFFFFF"
      material="emissive: #FFFFFF; emissiveIntensity: 0.8">
    </a-sphere>

    <a-sky color="#080820"></a-sky>
  </a-scene>
</body>
</html>
