<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>06 - Crawling Cursor</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-crawling-cursor@1.0.9/dist/aframe-crawling-cursor.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

  <a-sky color="#101525"></a-sky>

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-plane rotation="-90 0 0" width="20" height="20"
    color="#202C45"></a-plane>

  <a-text value="CRAWLING CURSOR"
    position="-2 3 -4" color="#00E5FF" width="5"></a-text>

  <!-- Superfícies para interação -->
  <a-box position="-2 1 -4"
    width="2" height="2" depth="0.5"
    color="#FF4F81"
    class="surface">
  </a-box>

  <a-sphere position="1 1 -4"
    radius="1"
    color="#00D9FF"
    class="surface">
  </a-sphere>

  <a-torus position="3 1 -4"
    radius="0.8"
    radius-tubular="0.2"
    color="#B66BFF"
    class="surface">
  </a-torus>

  <!-- Cursor que acompanha as superfícies -->
  <a-ring id="my-cursor"
    radius-inner="0.06"
    radius-outer="0.1"
    color="#FFFF00"
    rotation="0 0 0">
  </a-ring>

  <!-- Câmara com raycaster e crawling cursor -->
  <a-camera position="0 2 5"
    raycaster="objects: .surface; far: 10"
    crawling-cursor="target: #my-cursor; offset: 0.05">
  </a-camera>

</a-scene>
</body>
</html>
