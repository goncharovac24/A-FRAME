<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>21 - Line</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Line Component"
      position="-1 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-entity
      line="start: -2 1 -4; end: 2 1 -4; color: #4CC9F0">
    </a-entity>

    <a-entity
      line="start: -2 0.5 -4; end: 0 2 -4; color: #F72585">
    </a-entity>

    <a-entity
      line="start: 0 2 -4; end: 2 0.5 -4; color: #FFD166">
    </a-entity>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
