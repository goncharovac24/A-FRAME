<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>42 - UI Widgets</title>

  <script src="https://aframe.io/releases/0.7.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/aframe-ui-widgets@1.0.2/dist/aframe-ui-widgets.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-entity>

    <a-text
      value="UI Widgets"
      position="-1 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <!-- Botão -->
    <a-entity
      id="mybutton"
      ui-button
      position="-1 1.5 -3">
    </a-entity>

    <!-- Interruptor -->
    <a-entity
      id="mytoggle"
      ui-toggle="value: 0"
      position="0 1.5 -3">
    </a-entity>

    <!-- Slider -->
    <a-entity
      id="myslider"
      ui-slider="min: 0; max: 100; value: 50"
      position="1 1.5 -3">
    </a-entity>

    <!-- Indicadores -->
    <a-text
      id="buttonText"
      value="Botão: por pressionar"
      position="-1.5 0.5 -3"
      color="#4CC9F0"
      width="5">
    </a-text>

    <a-text
      id="toggleText"
      value="Interruptor: 0"
      position="-1.5 0.1 -3"
      color="#F72585"
      width="5">
    </a-text>

    <a-text
      id="sliderText"
      value="Slider: 50"
      position="-1.5 -0.3 -3"
      color="#FFD166"
      width="5">
    </a-text>

    <a-sky color="#172033"></a-sky>
  </a-scene>

  <script>
    const button = document.querySelector("#mybutton");
    const toggle = document.querySelector("#mytoggle");
    const slider = document.querySelector("#myslider");

    const buttonText = document.querySelector("#buttonText");
    const toggleText = document.querySelector("#toggleText");
    const sliderText = document.querySelector("#sliderText");

    button.addEventListener("pressed", function () {
      buttonText.setAttribute("value", "Botão: pressionado!");
    });

    toggle.addEventListener("change", function (event) {
      toggleText.setAttribute(
        "value",
        "Interruptor: " + event.detail.value
      );
    });

    slider.addEventListener("change", function (event) {
      sliderText.setAttribute(
        "value",
        "Slider: " + event.detail.value
      );
    });
  </script>
</body>
</html>
