<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>17 - GearVR Controls</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-gearvr-controls-component@0.1.4/dist/aframe-gearvr-controls-component.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

  <a-sky color="#101525"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-plane rotation="-90 0 0"
    width="20" height="20"
    color="#202C45">
  </a-plane>

  <a-text value="GEAR VR CONTROLS"
    position="-2 3 -4"
    color="#00E5FF"
    width="6">
  </a-text>

  <!-- Objetos da experiência -->
  <a-box position="-2 1 -4"
    color="#FF4F81"
    class="target">
  </a-box>

  <a-sphere position="0 1 -4"
    radius="0.7"
    color="#00D9FF"
    class="target">
  </a-sphere>

  <a-torus position="2 1 -4"
    radius="0.7"
    radius-tubular="0.15"
    color="#B66BFF"
    class="target">
  </a-torus>

  <!-- Controlador Gear VR -->
  <a-entity gearvr-controls="hand: right"></a-entity>

  <!-- Câmara -->
  <a-camera position="0 2 5"
    look-at="0 1 -4">
    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      raycaster="objects: .target">
    </a-cursor>
  </a-camera>

</a-scene>
</body>
</html>
