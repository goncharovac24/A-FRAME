<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>01 - Alongpath</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-curve-component/dist/aframe-curve-component.min.js"></script>
  <script src="https://unpkg.com/aframe-alongpath-component@1.0.9/dist/aframe-alongpath-component.min.js"></script>
</head>
<body>
<a-scene background="color: #101525">

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 2" position="2 5 3"></a-entity>

  <a-sky color="#101525"></a-sky>

  <a-plane rotation="-90 0 0" width="30" height="30"
    color="#17233D"></a-plane>

  <!-- Percurso -->
  <a-curve id="track">
    <a-curve-point position="-4 1 -4"></a-curve-point>
    <a-curve-point position="0 3 -5"></a-curve-point>
    <a-curve-point position="4 1 -3"></a-curve-point>
    <a-curve-point position="3 2 3"></a-curve-point>
    <a-curve-point position="-3 1 4"></a-curve-point>
  </a-curve>

  <!-- Pontos de referência -->
  <a-sphere position="-4 1 -4" radius="0.15" color="#00E5FF"></a-sphere>
  <a-sphere position="0 3 -5" radius="0.15" color="#00E5FF"></a-sphere>
  <a-sphere position="4 1 -3" radius="0.15" color="#00E5FF"></a-sphere>
  <a-sphere position="3 2 3" radius="0.15" color="#00E5FF"></a-sphere>
  <a-sphere position="-3 1 4" radius="0.15" color="#00E5FF"></a-sphere>

  <!-- Objeto em movimento -->
  <a-entity id="ship"
    geometry="primitive: cone; radiusBottom: 0.35; height: 0.8"
    material="color: #FF4FD8; emissive: #FF4FD8; emissiveIntensity: 0.4"
    rotation="90 0 0"
    alongpath="curve: #track; dur: 12000; loop: true; rotate: true">
  </a-entity>

  <a-camera position="0 6 13" look-at="0 1 0"></a-camera>

</a-scene>
</body>
</html>
