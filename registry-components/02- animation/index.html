
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>02 - Animation</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #111827">

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: point; intensity: 2" position="0 5 3"></a-entity>

  <a-sky color="#111827"></a-sky>

  <a-plane rotation="-90 0 0" width="20" height="20"
    color="#202C45"></a-plane>

  <!-- Cubo: movimento vertical -->
  <a-box position="-3 1 -4"
    color="#FF4F81"
    animation="property: position; to: -3 3 -4; dir: alternate; dur: 1800; loop: true">
  </a-box>

  <!-- Esfera: rotação -->
  <a-sphere position="0 1.5 -4" radius="0.8"
    color="#00D9FF"
    animation="property: rotation; to: 0 360 0; dur: 3000; loop: true">
  </a-sphere>

  <!-- Torus: alteração de escala -->
  <a-torus position="3 1.5 -4" radius="0.8"
    radius-tubular="0.15"
    color="#B66BFF"
    animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 1500; loop: true">
  </a-torus>

  <!-- Cubo: animação ativada pelo rato -->
  <a-box position="0 1 0" color="#FFD166"
    animation__hover="property: scale; to: 1.5 1.5 1.5; dur: 300; startEvents: mouseenter"
    animation__leave="property: scale; to: 1 1 1; dur: 300; startEvents: mouseleave">
  </a-box>

  <a-camera position="0 5 10" look-at="0 1 0"></a-camera>

</a-scene>
</body>
</html>
