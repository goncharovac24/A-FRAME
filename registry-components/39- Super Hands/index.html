<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>39 - Super Hands</title>

  <script src="https://aframe.io/releases/0.6.1/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@3.11.4/dist/aframe-extras.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/super-hands@2.0.1/dist/super-hands.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Controladores VR -->
    <a-entity
      hand-controls="left"
      super-hands
      sphere-collider="objects: .interactable">
    </a-entity>

    <a-entity
      hand-controls="right"
      super-hands
      sphere-collider="objects: .interactable">
    </a-entity>

    <a-text
      value="Super Hands - Grab and Stretch"
      position="-2 2.5 -4"
      color="#FFFFFF"
      width="6">
    </a-text>

    <!-- Objetos interativos -->
    <a-box
      class="interactable"
      position="-1 1 -3"
      color="#4CC9F0"
      hoverable
      grabbable
      stretchable
      drag-droppable>
    </a-box>

    <a-sphere
      class="interactable"
      position="1 1 -3"
      radius="0.6"
      color="#F72585"
      hoverable
      grabbable
      stretchable
      drag-droppable>
    </a-sphere>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#35465c">
    </a-plane>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
