<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>40 - Teleport Controls</title>

  <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-teleport-controls@0.2.0/dist/aframe-teleport-controls.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <!-- Câmara -->
    <a-entity
      id="cameraRig"
      position="0 0 0">

      <a-entity
        camera
        look-controls
        position="0 1.6 0">
      </a-entity>

    </a-entity>

    <!-- Controlador esquerdo -->
    <a-entity
      vive-controls="hand: left"
      teleport-controls="type: parabolic">
    </a-entity>

    <!-- Controlador direito -->
    <a-entity
      vive-controls="hand: right"
      teleport-controls="type: parabolic">
    </a-entity>

    <a-text
      value="Teleport Controls"
      position="-1.5 3 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <!-- Plataforma de partida -->
    <a-box
      position="0 0 -3"
      width="3"
      height="0.2"
      depth="3"
      color="#4CC9F0">
    </a-box>

    <!-- Plataforma de destino -->
    <a-box
      position="4 0 -6"
      width="3"
      height="0.2"
      depth="3"
      color="#F72585">
    </a-box>

    <a-plane
      rotation="-90 0 0"
      position="0 -0.12 0"
      width="30"
      height="30"
      color="#35465c">
    </a-plane>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
