
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>14 - Tube</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>
<a-scene background="color: #080D1C">

  <a-sky color="#080D1C"></a-sky>

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: point; intensity: 2"
    position="0 5 0"></a-entity>

  <!-- Percurso -->
  <a-curve id="path">
    <a-curve-point position="-4 1 -4"></a-curve-point>
    <a-curve-point position="-2 3 -2"></a-curve-point>
    <a-curve-point position="0 1 0"></a-curve-point>
    <a-curve-point position="2 3 2"></a-curve-point>
    <a-curve-point position="4 1 4"></a-curve-point>
  </a-curve>

  <!-- Tubo seguindo o percurso -->
  <a-tube
    path="-4 1 -4, -2 3 -2, 0 1 0, 2 3 2, 4 1 4"
    radius="0.12"
    segments="100"
    color="#00E5FF">
  </a-tube>

  <!-- Esfera decorativa -->
  <a-sphere position="-4 1 -4"
    radius="0.3"
    color="#FF4FD8"
    animation="property: position; to: 4 1 4; dur: 7000; loop: true">
  </a-sphere>

  <a-text value="NEON TUBE PATH"
    position="-2 4 -4"
    color="#FFFFFF"
    width="6">
  </a-text>

  <a-plane rotation="-90 0 0"
    width="30" height="30"
    color="#151D35">
  </a-plane>

  <a-camera position="0 6 12"
    look-at="0 1 0"
    wasd-controls>
  </a-camera>

</a-scene>
</body>
</html>
