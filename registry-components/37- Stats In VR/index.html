<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>37 - Stats in VR</title>

  <script src="https://aframe.io/releases/0.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-stats-in-vr-component@0.1.7/index.min.js"></script>
</head>

<body>
  <a-scene stats stats-in-vr background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Stats in VR"
      position="-1 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-box
      position="-1 1 -4"
      color="#4CC9F0"
      animation="property: rotation; to: 360 360 0; loop: true; dur: 4000">
    </a-box>

    <a-sphere
      position="1 1 -4"
      radius="0.7"
      color="#F72585"
      animation="property: position; to: 1 2 -4; dir: alternate; loop: true; dur: 2000">
    </a-sphere>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
