<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>19 - Leap Hands</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #202b3d">
    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Leap Hands"
      position="-1 2.5 -3"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-text
      value="Componente experimental: necessita de um sensor Leap Motion."
      position="-2 1.8 -3"
      color="#FFD166"
      width="5">
    </a-text>

    <a-box
      position="0 0.8 -3"
      color="#4CC9F0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
    </a-box>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#35465c">
    </a-plane>

    <a-sky color="#202b3d"></a-sky>
  </a-scene>
</body>
</html>
