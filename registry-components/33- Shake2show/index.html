<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>33 - Shake2show</title>

  <script src="https://aframe.io/releases/0.7.0/aframe.min.js"></script>
  <script src="https://raw.githubusercontent.com/rdub80/aframe-shake2show-component/master/dist/aframe-shake2show-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Shake2show"
      position="-1 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-entity
      shake2show="trigger: click"
      visible="false"
      position="0 1 -3"
      geometry="primitive: plane; width: 2.5; height: 1.5"
      material="color: #4CC9F0">

      <a-text
        value="Menu apresentado!"
        align="center"
        color="#172033"
        position="0 0 0.02"
        width="4">
      </a-text>

    </a-entity>

    <a-text
      value="Clica na cena para testar."
      position="-1.5 0.5 -3"
      color="#FFD166"
      width="5">
    </a-text>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
