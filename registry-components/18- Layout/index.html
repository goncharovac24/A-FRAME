<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>18 - Layout</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
</head>

<body>
<a-scene background="color: #080D1C">

  <a-sky color="#080D1C"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-text value="3D LAYOUT SYSTEM"
    position="-2 4 -5"
    color="#FFFFFF"
    width="7">
  </a-text>

  <!-- Organização circular -->
  <a-entity
    id="layout"
    layout="type: circle; radius: 3; plane: xz; angle: 360">

    <a-box color="#FF4F81"
      depth="0.7" height="0.7" width="0.7"
      animation="property: rotation; to: 0 360 0; dur: 5000; loop: true">
    </a-box>

    <a-sphere color="#00D9FF" radius="0.45"></a-sphere>

    <a-cone color="#FFD166"
      radius-bottom="0.5" height="1">
    </a-cone>

    <a-torus color="#B66BFF"
      radius="0.5" radius-tubular="0.12">
    </a-torus>

    <a-cylinder color="#00D9A6"
      radius="0.4" height="0.9">
    </a-cylinder>

    <a-dodecahedron color="#FF914D"
      radius="0.5">
    </a-dodecahedron>

  </a-entity>

  <!-- Objeto central -->
  <a-sphere position="0 1 0"
    radius="0.7"
    color="#FFFFFF"
    material="emissive: #00E5FF; emissiveIntensity: 0.4"
    animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1500; loop: true">
  </a-sphere>

  <a-camera position="0 4 9"
    look-at="0 1 0"
    wasd-controls>
  </a-camera>

</a-scene>
</body>
</html>
