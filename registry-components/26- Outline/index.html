<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>26 - Outline</title>

  <script src="https://aframe.io/releases/0.7.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-outline@1.1.1/build/aframe-outline.min.js"></script>
</head>

<body>
  <a-scene outline="color: #00FFFF; thickness: 0.005">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-box
      position="-1 1 -4"
      color="#4CC9F0"
      rotation="0 30 0">
    </a-box>

    <a-sphere
      position="1 1 -4"
      radius="0.7"
      color="#F72585">
    </a-sphere>

    <a-cylinder
      position="0 0.7 -3"
      radius="0.4"
      height="1.4"
      color="#FFD166">
    </a-cylinder>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#35465c">
    </a-plane>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
