<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>35 - Speech Command</title>

  <script src="https://aframe.io/releases/0.7.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.5.0/annyang.min.js"></script>
  <script src="https://raw.githubusercontent.com/lmalave/aframe-speech-command-component/master/dist/aframe-speech-command-component.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <!-- Reconhecimento de voz -->
    <a-entity
      id="annyang"
      annyang-speech-recognition>
    </a-entity>

    <!-- Menu -->
    <a-entity
      id="menu"
      visible="false"
      position="0 1 -3"
      geometry="primitive: plane; width: 3; height: 1.5"
      material="color: #4CC9F0"
      speech-command__show="
        command: show menu;
        type: attribute;
        attribute: visible;
        value: true"
      speech-command__hide="
        command: hide menu;
        type: attribute;
        attribute: visible;
        value: false">

      <a-text
        value="MENU ABERTO"
        align="center"
        color="#172033"
        position="0 0 0.02"
        width="4">
      </a-text>

    </a-entity>

    <a-text
      value="Diz: show menu ou hide menu"
      position="-2 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
