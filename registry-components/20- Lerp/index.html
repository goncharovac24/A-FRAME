<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>20 - Lerp</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-lerp-component@1.0.2/dist/aframe-lerp-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Lerp - Linear Interpolation"
      position="-1.8 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-box
      position="-2 1 -4"
      color="#4CC9F0"
      animation="property: position; from: -2 1 -4; to: 2 1 -4; dur: 4000; dir: alternate; loop: true">
    </a-box>

    <a-plane
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#35465c">
    </a-plane>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
