<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>15 - Forcegraph</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-forcegraph-component/dist/aframe-forcegraph-component.min.js"></script>
</head>

<body>
<a-scene background="color: #080D1C">

  <a-sky color="#080D1C"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>

  <a-text value="3D NETWORK GRAPH"
    position="-2 4 -5"
    color="#00E5FF"
    width="7">
  </a-text>

  <!-- Gráfico de relações -->
  <a-entity
    forcegraph="
      graphData: #graphData;
      nodeRelSize: 8;
      nodeColor: color;
      linkColor: #64748b;
      linkWidth: 1">
  </a-entity>

  <a-camera position="0 0 15"
    look-controls
    wasd-controls>
  </a-camera>

</a-scene>

<script>
const graphData = {
  nodes: [
    {id: "Design", color: "#FF4F81"},
    {id: "Multimedia", color: "#00D9FF"},
    {id: "Photography", color: "#FFD166"},
    {id: "Video", color: "#B66BFF"},
    {id: "Animation", color: "#00D9A6"},
    {id: "Web", color: "#FF914D"},
    {id: "Sound", color: "#F472B6"},
    {id: "3D", color: "#60A5FA"}
  ],
  links: [
    {source: "Design", target: "Multimedia"},
    {source: "Multimedia", target: "Photography"},
    {source: "Multimedia", target: "Video"},
    {source: "Video", target: "Animation"},
    {source: "Animation", target: "3D"},
    {source: "Design", target: "Web"},
    {source: "Video", target: "Sound"},
    {source: "3D", target: "Web"},
    {source: "Photography", target: "Design"}
  ]
};

const scene = document.querySelector("a-scene");

scene.addEventListener("loaded", () => {
  const graph = document.querySelector("[forcegraph]");
  graph.setAttribute("forcegraph", "graphData", graphData);
});
</script>

</body>
</html>
