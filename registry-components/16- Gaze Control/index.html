<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>16 - Gaze Control</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

  <a-sky color="#101525"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-text value="GAZE INTERACTION"
    position="-2 3 -4"
    color="#00E5FF"
    width="6">
  </a-text>

  <!-- Objetos selecionáveis -->
  <a-box position="-2 1 -4"
    color="#FF4F81"
    class="target"
    event-set__click="_event: click; color: #00D9A6">
  </a-box>

  <a-sphere position="0 1 -4"
    radius="0.7"
    color="#00D9FF"
    class="target"
    event-set__click="_event: click; color: #FFD166">
  </a-sphere>

  <a-torus position="2 1 -4"
    radius="0.7"
    radius-tubular="0.15"
    color="#B66BFF"
    class="target"
    event-set__click="_event: click; color: #FF914D">
  </a-torus>

  <!-- Câmara e cursor de olhar -->
  <a-camera position="0 1.6 0">
    <a-cursor
      fuse="true"
      fuse-timeout="1500"
      raycaster="objects: .target"
      material="color: white; shader: flat"
      geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025">
    </a-cursor>
  </a-camera>

</a-scene>
</body>
</html>
