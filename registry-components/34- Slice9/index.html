<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>34 - Slice9</title>

  <script src="https://aframe.io/releases/0.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-slice9-component/dist/aframe-slice9-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Slice9 Component"
      position="-1.5 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-entity
      position="0 1 -4"
      geometry="primitive: plane; width: 3; height: 2"
      material="color: #4CC9F0"
      slice9="
        width: 3;
        height: 2;
        left: 0.2;
        right: 0.2;
        top: 0.2;
        bottom: 0.2;
        color: #4CC9F0;
        debug: true">
    </a-entity>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
