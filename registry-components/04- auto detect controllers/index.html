<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>04 - Auto Detect Controllers</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-auto-detect-controllers-component@0.1.4/dist/aframe-auto-detect-controllers-component.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

  <a-sky color="#101525"></a-sky>

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: point; intensity: 2" position="0 4 0"></a-entity>

  <a-plane rotation="-90 0 0" width="20" height="20"
    color="#202C45"></a-plane>

  <a-text value="VR CONTROLLER DETECTION"
    position="-2.5 3 -4" width="6"
    color="#00E5FF"></a-text>

  <!-- Deteção da mão esquerda -->
  <a-entity id="left-controller"
    position="-1 1 -3"
    auto-detect-controllers="hand: left">
  </a-entity>

  <!-- Deteção da mão direita -->
  <a-entity id="right-controller"
    position="1 1 -3"
    auto-detect-controllers="hand: right">
  </a-entity>

  <!-- Indicadores visuais -->
  <a-sphere position="-1 0.5 -3" radius="0.2"
    color="#00E5FF"></a-sphere>

  <a-sphere position="1 0.5 -3" radius="0.2"
    color="#FF4FD8"></a-sphere>

  <a-text value="LEFT HAND" position="-2 0 -3"
    color="#00E5FF" width="3"></a-text>

  <a-text value="RIGHT HAND" position="0.2 0 -3"
    color="#FF4FD8" width="3"></a-text>

  <a-camera position="0 2 5" look-at="0 1 -3"></a-camera>

</a-scene>
</body>
</html>
