<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>22 - Log</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-log-component@1.0.7/dist/aframe-log-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Log Component"
      position="-1 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-entity
      position="0 1 -3"
      log
      geometry="primitive: plane; width: 4; height: 2"
      material="color: #101820">
    </a-entity>

    <a-entity
      position="0 0 -3"
      id="logger">
    </a-entity>

    <a-sky color="#172033"></a-sky>

  </a-scene>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        AFRAME.log("Olá! Esta é uma mensagem de teste.");
        AFRAME.log("Mensagem enviada para o canal de teste.", "teste");
      }, 1500);
    });
  </script>
</body>
</html>
