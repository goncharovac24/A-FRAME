<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>36 - Spritesheet</title>

  <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-spritesheet-component/dist/aframe-spritesheet-component.min.js"></script>
</head>

<body>
  <a-scene background="color: #172033">

    <a-assets>
      <img
        id="spriteImage"
        src="spritesheet.png">
    </a-assets>

    <a-entity position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Spritesheet Animation"
      position="-1.5 2.5 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-image
      src="#spriteImage"
      position="0 1 -4"
      width="2"
      height="2"
      sprite-sheet="
        cols: 4;
        rows: 1;
        progress: 0"
      animation="
        property: sprite-sheet.progress;
        from: 0;
        to: 1;
        dur: 1500;
        loop: true">
    </a-image>

    <a-sky color="#172033"></a-sky>
  </a-scene>
</body>
</html>
