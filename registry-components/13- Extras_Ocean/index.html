<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>13 - Ocean</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>
<a-scene background="color: #87CEEB">

  <a-sky color="#87CEEB"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="-3 8 5"></a-entity>

  <!-- Oceano -->
  <a-ocean
    position="0 0 0"
    width="100"
    depth="100"
    density="30"
    amplitude="0.15"
    amplitude-variance="0.15"
    speed="1"
    speed-variance="1"
    color="#087CA7">
  </a-ocean>

  <!-- Ilha -->
  <a-cone position="0 0.7 -5"
    radius-bottom="3"
    radius-top="0.2"
    height="2"
    color="#A77945">
  </a-cone>

  <a-cylinder position="0 1.7 -5"
    radius="2.5"
    height="0.3"
    color="#62B96A">
  </a-cylinder>

  <!-- Palmeiras decorativas -->
  <a-cylinder position="-1 2.5 -5"
    radius="0.08"
    height="2"
    color="#79502D">
  </a-cylinder>

  <a-cone position="-1 3.5 -5"
    radius-bottom="1"
    radius-top="0.1"
    height="1.5"
    color="#167C50">
  </a-cone>

  <a-text value="TROPICAL OCEAN"
    position="-2 5 -5"
    color="#FFFFFF"
    width="6">
  </a-text>

  <a-camera position="0 4 10"
    look-at="0 1 -5"
    wasd-controls>
  </a-camera>

</a-scene>
</body>
</html>
