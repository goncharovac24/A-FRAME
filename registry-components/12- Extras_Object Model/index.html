<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>12 - Object Model</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://unpkg.com/aframe-extras.object-model@3.8.3/dist/aframe-extras.object-model.min.js"></script>
</head>

<body>
<a-scene background="color: #090E1D">

  <a-sky color="#090E1D"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-plane rotation="-90 0 0"
    width="20" height="20" color="#1D2942">
  </a-plane>

  <a-text value="OBJECT MODEL"
    position="-1.5 3 -4"
    color="#FF4FD8" width="5">
  </a-text>

  <!-- Modelo 3D -->
  <a-entity
    object-model="src: url(models/object.json)"
    position="0 1 -4"
    rotation="0 180 0"
    scale="1 1 1"
    animation="property: rotation; to: 0 540 0; dur: 8000; loop: true">
  </a-entity>

  <a-camera position="0 2 5"
    look-at="0 1 -4">
  </a-camera>

</a-scene>
</body>
</html>
