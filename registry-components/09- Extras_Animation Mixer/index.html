<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>09 - Animation Mixer</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>

<body>
<a-scene background="color: #101525">

  <a-sky color="#101525"></a-sky>

  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-plane rotation="-90 0 0"
    width="20" height="20" color="#27334A">
  </a-plane>

  <a-text value="ANIMATION MIXER"
    position="-1.8 3.5 -4"
    color="#FFFFFF" width="5">
  </a-text>

  <a-entity
    gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb"
    position="0 0 -4"
    scale="0.04 0.04 0.04"
    animation-mixer="clip: Survey; loop: repeat">
  </a-entity>

  <a-camera position="0 2 5"
    look-at="0 1 -4">
  </a-camera>

</a-scene>
</body>
</html>
