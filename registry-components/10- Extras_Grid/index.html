<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>10 - Grid</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-extras.grid@3.8.3/dist/aframe-extras.grid.min.js"></script>
</head>
<body>
<a-scene background="color: #080D1C">

  <a-sky color="#080D1C"></a-sky>

  <!-- Grelha principal -->
  <a-grid position="0 0 0"
    width="20"
    height="20"
    color="#00D9FF">
  </a-grid>

  <!-- Objetos de referência -->
  <a-box position="-3 1 -3"
    color="#FF4F81"
    animation="property: rotation; to: 0 360 0; dur: 5000; loop: true">
  </a-box>

  <a-sphere position="0 1 -3"
    radius="0.7"
    color="#B66BFF">
  </a-sphere>

  <a-cylinder position="3 1 -3"
    radius="0.6"
    height="2"
    color="#00D9A6">
  </a-cylinder>

  <a-text value="3D GRID SPACE"
    position="-1.5 4 -3"
    color="#FFFFFF"
    width="5">
  </a-text>

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="2 5 3"></a-entity>

  <a-camera position="0 3 7"
    look-at="0 1 -3"
    wasd-controls>
  </a-camera>

</a-scene>
</body>
</html>
