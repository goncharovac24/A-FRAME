<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>08 - Event Set</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
</head>
<body>
<a-scene background="color: #101525">

  <a-entity light="type: ambient; intensity: 1"></a-entity>
  <a-entity light="type: directional; intensity: 2"
    position="1 4 3"></a-entity>

  <a-text value="INTERACTIVE GALLERY"
    position="-2 3 -4" color="#FFFFFF" width="6">
  </a-text>

  <a-box position="-2 1 -4"
    color="#FF4F81"
    event-set__enter="_event: mouseenter; color: #FFD166; scale: 1.3 1.3 1.3"
    event-set__leave="_event: mouseleave; color: #FF4F81; scale: 1 1 1"
    event-set__click="_event: click; rotation: 0 180 0">
  </a-box>

  <a-sphere position="0 1 -4"
    color="#00D9FF"
    event-set__enter="_event: mouseenter; color: #FFFFFF; scale: 1.3 1.3 1.3"
    event-set__leave="_event: mouseleave; color: #00D9FF; scale: 1 1 1"
    event-set__click="_event: click; position: 0 2 -4">
  </a-sphere>

  <a-torus position="2 1 -4"
    color="#B66BFF"
    radius="0.7"
    radius-tubular="0.15"
    event-set__enter="_event: mouseenter; color: #FF4FD8"
    event-set__leave="_event: mouseleave; color: #B66BFF">
  </a-torus>

  <a-camera position="0 2 5">
    <a-cursor raycaster="objects: a-box, a-sphere, a-torus"></a-cursor>
  </a-camera>

</a-scene>
</body>
</html>
