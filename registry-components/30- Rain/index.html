<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>30 - Rain</title>

  <script src="https://aframe.io/releases/0.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-rain@1.0.2/build/aframe-rain.min.js"></script>
</head>

<body>
  <a-scene
    rain="
      color: #AADDFF;
      count: 3000;
      height: 20;
      width: 20;
      splash: true">

    <a-entity position="0 1.6 5">
      <a-camera></a-camera>
    </a-entity>

    <a-text
      value="Rain Component"
      position="-1.5 3 -4"
      color="#FFFFFF"
      width="5">
    </a-text>

    <a-box
      position="0 1 -4"
      color="#526D82"
      width="2"
      height="2"
      depth="2">
    </a-box>

    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#263746">
    </a-plane>

    <a-entity
      light="type: directional; color: #FFFFFF; intensity: 0.5"
      position="-3 8 5">
    </a-entity>

    <a-sky color="#222D3A"></a-sky>
  </a-scene>
</body>
</html>
