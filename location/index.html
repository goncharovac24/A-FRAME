
<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Objetos numa localização GPS</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  </head>

  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960;"
    >
      <a-camera
        gps-camera="simulateLatitude: 51.049; simulateLongitude: -0.723"
        rotation-reader
      ></a-camera>

      <!-- TEXTO VERMELHO -->
      <a-text
        value="Olá Mundo!"
        scale="6 6 6"
        align="center"
        color="#ff0000"
        gps-entity-place="latitude: 51.0491; longitude: -0.723;"
      ></a-text>

      <!-- CUBO AZUL -->
      <a-box
        color="#0066ff"
        scale="3 3 3"
        gps-entity-place="latitude: 51.04915; longitude: -0.723;"
      ></a-box>

      <!-- ESFERA VERDE -->
      <a-sphere
        color="#00cc66"
        radius="1.5"
        gps-entity-place="latitude: 51.04905; longitude: -0.3229;"
      ></a-sphere>

    </a-scene>
  </body>
</html>
